<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>へきネイター - オフライン</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#0c1020; color:#f7f8fc; font-family:'Hiragino Sans','Yu Gothic UI','Noto Sans JP',system-ui,sans-serif;
       display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; text-align:center; padding:24px; }
.icon { font-size:4rem; margin-bottom:16px; }
h1 { font-size:1.4rem; color:#ff5470; margin-bottom:8px; }
p { color:#bdc7db; font-size:0.9rem; line-height:1.7; margin-bottom:24px; }
button { min-height:48px; background:#d93658; color:#fff; border:1px solid transparent;
         border-radius:10px; padding:12px 28px; font-size:1rem; font-weight:bold; cursor:pointer; }
button:hover { opacity:0.85; }
button:focus-visible { outline:3px solid #ffd166; outline-offset:3px; }
</style>
</head><body>
<div>
  <div class="icon">📡</div>
  <h1>オフラインです</h1>
  <p>インターネット接続がありません。<br>接続を確認してからもう一度お試しください。</p>
  <button id="retry-button" type="button">再試行</button>
</div>
<script>
document.getElementById('retry-button').addEventListener('click', () => location.reload());
</script>
</body></html>
